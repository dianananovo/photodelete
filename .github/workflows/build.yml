name: 编译生成一加15相册清理APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # 支持网页上手动一键点击触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译生成 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传打包生成的 APK
        uses: actions/upload-artifact@v4
        with:
          name: XiuXiuPhotoClean-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
